name: Quality Gate

on:
  # Every pull request, whatever it targets — NOT just PRs into main.
  # This epic stacks PRs (slice 2 onto slice 1, the audit writer onto that),
  # and with a `branches: [main]` filter those never ran the gate at all: the
  # only checks that fired were the image builds, so a stacked PR showed a
  # green tick that meant nothing about lint, types, or tests.
  pull_request:
  push:
    branches: [main]

# Checkout + run tests only — no write surface needed.
permissions:
  contents: read

jobs:
  checks:
    name: Checks (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @sr/shared build && pnpm --filter @sr/db build

      - name: Lint (eslint, whole monorepo)
        run: pnpm lint

      - name: Type check (all packages)
        run: pnpm -r typecheck

      # One vitest worker per CPU. Vitest's default is one fewer, to leave a
      # core for its own process — on a dev box that is right; here that
      # process is idle while the db-backed suites, which are CPU-bound (a
      # WASM Postgres per test), run on the rest, and the spare core is worth
      # about 15% of the step. `nproc` keeps it true on whatever runner size
      # the job lands on. The env var takes an integer only — a percentage is
      # parsed as a count, so `100%` would mean 100 workers.
      - name: Tests (all packages)
        run: VITEST_MAX_WORKERS=$(nproc) pnpm -r test

  spec-drift:
    name: Chain catalogs ↔ lava-specs drift
    runs-on: ubuntu-latest
    # Only meaningful when the base is `main`. A `pull_request` job runs against
    # head-merged-into-base, so on a stacked PR the base is a feature branch and
    # this compares *that branch's* chain map to upstream — reporting the base's
    # staleness as if it were the PR's fault. Typecheck and tests above are
    # meaningful on any base; this one isn't, so it sits out.
    if: github.event_name == 'push' || github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Regenerate the chain map, the Try-it method catalog and the
      # runnable-defaults roll-call from the live Magma-Devs/lava-specs repo,
      # and fail if any differs from the committed copy — i.e. upstream added a
      # chain / renamed one / changed its interfaces or methods and the
      # dashboard is stale. Network/API failures soft-skip so upstream
      # flakiness can't block a merge. GITHUB_TOKEN raises the API rate limit.
      - name: Check the committed catalogs are in sync with lava-specs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/web/scripts/check-spec-sync.mjs
