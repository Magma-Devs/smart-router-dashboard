name: Quality Gate

on:
  # Every pull request, whatever it targets — NOT just PRs into main.
  # This epic stacks PRs (slice 2 onto slice 1, the audit writer onto that),
  # and with a `branches: [main]` filter those never ran the gate at all: the
  # only checks that fired were the image builds, so a stacked PR showed a
  # green tick that meant nothing about lint, types, or tests.
  pull_request:
  push:
    branches: [main]
  # Run it by hand against any branch.
  #
  # `pull_request` is the only trigger a stacked PR normally has, and it depends
  # on GitHub computing the PR's merge ref. Force-pushing a chain of branches
  # whose bases move at the same moment can wedge that: the PRs sit at
  # `mergeable: unknown`, no `synchronize` event is dispatched, and the gate
  # silently keeps showing its result for the superseded commit — a green tick
  # that means nothing about what is now on the branch. Closing and reopening
  # the PR does not shake it loose.
  #
  # So: a manual dispatch. `gh workflow run quality-gate.yml --ref <branch>`
  # attaches a run to that branch's head, which is what the PR displays.
  #
  # NOTE: GitHub only offers this from the DEFAULT branch's copy of the file, so
  # it does nothing for the stack that prompted it — it is reachable once this
  # has merged, which is the next time it happens.
  workflow_dispatch:

# Checkout + run tests only — no write surface needed.
permissions:
  contents: read

jobs:
  checks:
    name: Checks (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @sr/shared build && pnpm --filter @sr/db build

      - name: Lint (eslint, whole monorepo)
        run: pnpm lint

      - name: Type check (all packages)
        run: pnpm -r typecheck

      - name: Tests (all packages)
        run: pnpm -r test

  e2e:
    name: Browser tests (2FA flows)
    runs-on: ubuntu-latest
    services:
      # The accounts database. The api migrates it on boot, so nothing here
      # has to know the schema.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sr
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: sr_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sr -d sr_dashboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # api and web run from source here, and both read `@sr/shared` and
      # `@sr/db` out of dist/ — the same reason the checks job builds them.
      - name: Build workspace packages
        run: pnpm --filter @sr/shared build && pnpm --filter @sr/db build

      - name: Install Chromium
        run: pnpm --filter @sr/e2e exec playwright install --with-deps chromium

      # Playwright boots the api and the web itself (see e2e/playwright.config.ts)
      # — there is no compose stack in CI, and the dev one bind-mounts a
      # developer's working tree.
      - name: Run the suite
        env:
          E2E_DATABASE_URL: postgres://sr:dev@localhost:5432/sr_dashboard
        run: pnpm e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/.playwright/results/
          retention-days: 7

  spec-drift:
    name: Chain catalogs ↔ lava-specs drift
    runs-on: ubuntu-latest
    # Only meaningful when the base is `main`. A `pull_request` job runs against
    # head-merged-into-base, so on a stacked PR the base is a feature branch and
    # this compares *that branch's* chain map to upstream — reporting the base's
    # staleness as if it were the PR's fault. Typecheck and tests above are
    # meaningful on any base; this one isn't, so it sits out.
    if: github.event_name == 'push' || github.base_ref == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Regenerate the chain map, the Try-it method catalog and the
      # runnable-defaults roll-call from the live Magma-Devs/lava-specs repo,
      # and fail if any differs from the committed copy — i.e. upstream added a
      # chain / renamed one / changed its interfaces or methods and the
      # dashboard is stale. Network/API failures soft-skip so upstream
      # flakiness can't block a merge. GITHUB_TOKEN raises the API rate limit.
      - name: Check the committed catalogs are in sync with lava-specs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node apps/web/scripts/check-spec-sync.mjs
