version: 2

# Every version in this repo is pinned: npm packages and overrides to exact
# versions, actions to commit SHAs, images to digests. These updaters are how
# the pins move. Each waits 7 days after a release before proposing it, the
# same age pnpm's minimumReleaseAge enforces (pnpm-workspace.yaml), so a
# version update never proposes a release the install would refuse. Security
# updates are not delayed by the cooldown.
#
# Dependabot does not edit `overrides` in pnpm-workspace.yaml. A transitive
# package pinned there moves only when someone edits it by hand.
#
# Node and pnpm are each pinned twice: `.nvmrc` and `packageManager` (what CI
# installs) and the Dockerfiles' FROM lines (what the images ship). The docker
# updater moves only the Dockerfiles, so its Node or pnpm PR fails the quality
# gate's "pins agree" step (apps/web/scripts/check-pins.mjs) until the same PR
# moves `.nvmrc` or `packageManager` to match.
#
# Majors of Node, the pnpm image and @types/node are not proposed: each is a
# migration done by hand (Node 25 dropped corepack; pnpm 11 moved every
# setting). Minor and patch releases, security releases among them, are.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Follows the Node major in .nvmrc, so it moves with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to commit SHAs with the release in a trailing comment
  # (`@<sha> # v7.0.1`); the updater moves both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Base images: apps/api/Dockerfile, apps/web/Dockerfile, Dockerfile.dev.
  # Each FROM carries a version tag and a digest; the updater moves both.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/api"
      - "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # One PR per image across the three Dockerfiles, not one per directory:
      # a Node or pnpm bump is a single PR, where `.nvmrc` or `packageManager`
      # is then moved to match.
      images:
        group-by: dependency-name
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # ghcr.io/pnpm/pnpm; the name may or may not carry the registry host.
      - dependency-name: "*pnpm/pnpm"
        update-types: ["version-update:semver-major"]

  # The local and demo stacks: docker-compose.yml, docker-compose.dev.yml,
  # docker-compose.managed.yml.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    ignore:
      # Our own router image, followed on `main` by design (SR_ROUTER_IMAGE
      # overrides it).
      - dependency-name: "ghcr.io/magma-devs/smart-router"
