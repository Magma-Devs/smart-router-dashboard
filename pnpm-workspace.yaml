packages:
  - "packages/*"
  - "apps/*"
  - "e2e"

# Supply-chain settings. Every version in this repo is exact (package.json,
# overrides, the lockfile); these settings decide what a NEW version may be.
#
# minimumReleaseAge: 0 installs a release as soon as it is published. pnpm's
#   own default is a 1-day minimum; this repo opts out of any age check.
# trustPolicy: refuse a version published with weaker evidence than the
#   package's earlier versions (e.g. a plain token publish after trusted
#   publishing), the usual sign of a stolen npm token.
# blockExoticSubdeps: a dependency of a dependency may not come from a git
#   repo or a tarball URL, only from the registry.
# saveExact: `pnpm add` writes an exact version, never a ^range.
minimumReleaseAge: 0
trustPolicy: no-downgrade
blockExoticSubdeps: true
saveExact: true
# Exact versions only, each with its reason. A new version of a package listed
# here is checked again, so an upgrade means re-reading its publish record.
trustPolicyExclude:
  # Every next-auth release since 2025-10-26 trips no-downgrade: the only
  # version ever published with provenance is the experimental build
  # 0.0.0-manual.2824fa11, and the 4.x/5.x-beta releases after it are plain
  # maintainer publishes. beta.32 (2026-07-20) is by the same maintainer as
  # beta.31 and has run here since then.
  - next-auth@5.0.0-beta.32

# Transitive versions forced to a fixed release, mostly to take a security fix
# a dependency has not picked up yet. pnpm reads them only from this file.
# Dependabot does not edit them: one moves only when someone edits it here.
overrides:
  "brace-expansion@<5.0.8": "5.0.12"
  "browserslist@<4.28.7": "4.29.3"
  "esbuild@<0.25.0": "0.28.2"
  "fast-copy@<4.1.0": "4.1.2"
  "fast-jwt@<6.3.4": "6.3.4"
  "fast-uri@<3.1.8": "3.1.9"
  "find-my-way@<9.7.0": "9.10.0"
  "glob": "14.0.3"
  "ip-address@<10.7.1": "10.7.6"
  "minimatch": "11.0.4"
  "postcss@<8.5.18": "8.5.32"
  "sharp@<0.35.0": "0.35.5"
  "zod@<4.6.6": "4.6.7"

# Packages whose install scripts may run. Anything with an install script that
# is not listed fails the install. esbuild ships its binary as a platform
# package, so its postinstall (a binary check) stays off.
allowBuilds:
  esbuild: false
